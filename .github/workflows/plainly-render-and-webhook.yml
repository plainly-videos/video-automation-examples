name: plainly-render-and-webhook

on:
  push:
    branches: [main, master]
    paths:
      - "plainly-render-and-webhook/**"
      - ".github/workflows/plainly-render-and-webhook.yml"
  pull_request:
    paths:
      - "plainly-render-and-webhook/**"
      - ".github/workflows/plainly-render-and-webhook.yml"

jobs:
  build-plainly-render-and-webhook:
    name: Build plainly-render-and-webhook
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plainly-render-and-webhook

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: plainly-render-and-webhook/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          working-dir: plainly-render-and-webhook

      - name: Run Biome
        run: biome ci .

      - name: Build
        run: pnpm build
