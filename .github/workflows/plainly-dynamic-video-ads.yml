name: plainly-dynamic-video-ads

on:
  push:
    branches: [main, master]
    paths:
      - "plainly-dynamic-video-ads/**"
      - ".github/workflows/plainly-dynamic-video-ads.yml"
  pull_request:
    paths:
      - "plainly-dynamic-video-ads/**"
      - ".github/workflows/plainly-dynamic-video-ads.yml"

jobs:
  build-plainly-dynamic-video-ads:
    name: Build plainly-dynamic-video-ads
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plainly-dynamic-video-ads

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: plainly-dynamic-video-ads/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          working-dir: plainly-dynamic-video-ads

      - name: Run Biome
        run: biome ci .

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
