name: Continuous integration

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # Each example builds only when its folder (or this workflow) changed
  changes:
    name: Detect changed examples
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      plainly-render-and-webhook: ${{ steps.filter.outputs.plainly-render-and-webhook }}
      mcp-ai-crypto-video-agent: ${{ steps.filter.outputs.mcp-ai-crypto-video-agent }}
      plainly-batch-render: ${{ steps.filter.outputs.plainly-batch-render }}
      plainly-dynamic-video-ads: ${{ steps.filter.outputs.plainly-dynamic-video-ads }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Filter paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            plainly-render-and-webhook:
              - "plainly-render-and-webhook/**"
              - ".github/workflows/ci.yml"
            mcp-ai-crypto-video-agent:
              - "mcp-ai-crypto-video-agent/**"
              - ".github/workflows/ci.yml"
            plainly-batch-render:
              - "plainly-batch-render/**"
              - ".github/workflows/ci.yml"
            plainly-dynamic-video-ads:
              - "plainly-dynamic-video-ads/**"
              - ".github/workflows/ci.yml"

  build-plainly-render-and-webhook:
    name: Build plainly-render-and-webhook
    needs: changes
    if: needs.changes.outputs.plainly-render-and-webhook == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plainly-render-and-webhook

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: plainly-render-and-webhook/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          working-dir: plainly-render-and-webhook

      - name: Run Biome
        run: biome ci .

      - name: Build
        run: pnpm build

  build-mcp-ai-crypto-video-agent:
    name: Build mcp-ai-crypto-video-agent
    needs: changes
    if: needs.changes.outputs.mcp-ai-crypto-video-agent == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-ai-crypto-video-agent

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: mcp-ai-crypto-video-agent/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          working-dir: mcp-ai-crypto-video-agent

      - name: Run Biome
        run: biome ci .

      - name: Build
        run: pnpm build

  build-plainly-batch-render:
    name: Build plainly-batch-render
    needs: changes
    if: needs.changes.outputs.plainly-batch-render == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plainly-batch-render

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: plainly-batch-render/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          working-dir: plainly-batch-render

      - name: Run Biome
        run: biome ci .

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  build-plainly-dynamic-video-ads:
    name: Build plainly-dynamic-video-ads
    needs: changes
    if: needs.changes.outputs.plainly-dynamic-video-ads == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plainly-dynamic-video-ads

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: plainly-dynamic-video-ads/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          working-dir: plainly-dynamic-video-ads

      - name: Run Biome
        run: biome ci .

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
