name: Continuous integration

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-plainly-render-and-webhook:
    name: Build plainly-render-and-webhook
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plainly-render-and-webhook

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: plainly-render-and-webhook/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          working-dir: plainly-render-and-webhook

      - name: Run Biome
        run: biome ci .

      - name: Build
        run: pnpm build

  build-mcp-ai-crypto-video-agent:
    name: Build mcp-ai-crypto-video-agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-ai-crypto-video-agent

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: mcp-ai-crypto-video-agent/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          working-dir: mcp-ai-crypto-video-agent

      - name: Run Biome
        run: biome ci .

      - name: Build
        run: pnpm build

  build-plainly-batch-render:
    name: Build plainly-batch-render
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plainly-batch-render

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: plainly-batch-render/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          working-dir: plainly-batch-render

      - name: Run Biome
        run: biome ci .

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  build-plainly-dynamic-video-ads:
    name: Build plainly-dynamic-video-ads
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plainly-dynamic-video-ads

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: plainly-dynamic-video-ads/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          working-dir: plainly-dynamic-video-ads

      - name: Run Biome
        run: biome ci .

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
