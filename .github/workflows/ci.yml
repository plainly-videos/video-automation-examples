name: Continuous integration

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # Every top-level folder with a package.json is an example. Only changed
  # examples build, so a new example needs no change here
  changes:
    name: Detect changed examples
    runs-on: ubuntu-latest
    outputs:
      examples: ${{ steps.list.outputs.examples }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: List changed examples
        id: list
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          all=$(ls -d */package.json | xargs -n1 dirname)
          # A change to this workflow, or a base that can't be compared, builds everything
          if changed=$(git diff --name-only "$BASE" HEAD) && ! grep -qx .github/workflows/ci.yml <<< "$changed"; then
            examples=$(grep -Fxf <(cut -d/ -f1 <<< "$changed" | sort -u) <<< "$all" || true)
          else
            examples=$all
          fi
          echo "examples=$(jq -cn '$ARGS.positional' --args $examples)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.example }}
    needs: changes
    if: needs.changes.outputs.examples != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.changes.outputs.examples) }}
    defaults:
      run:
        working-directory: ${{ matrix.example }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Versions come from the example's packageManager field and .nvmrc
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: ${{ matrix.example }}/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ${{ matrix.example }}/.nvmrc
          cache: pnpm
          cache-dependency-path: ${{ matrix.example }}/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          working-dir: ${{ matrix.example }}

      - name: Run Biome
        run: biome ci .

      - name: Typecheck
        run: pnpm run --if-present typecheck

      - name: Test
        run: pnpm run --if-present test

      - name: Build
        run: pnpm build
