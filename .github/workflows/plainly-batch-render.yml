name: plainly-batch-render

on:
  push:
    branches: [main, master]
    paths:
      - "plainly-batch-render/**"
      - ".github/workflows/plainly-batch-render.yml"
  pull_request:
    paths:
      - "plainly-batch-render/**"
      - ".github/workflows/plainly-batch-render.yml"

jobs:
  build-plainly-batch-render:
    name: Build plainly-batch-render
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plainly-batch-render

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: plainly-batch-render/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          working-dir: plainly-batch-render

      - name: Run Biome
        run: biome ci .

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
